spring:
  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    consumer:
      auto-offset-reset: earliest
      # group-id: test-group   # (opcional)
      properties:
        spring.json.trusted.packages: "*"

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driverClassName: org.h2.Driver
    username: sa
    password: sa

  jpa:
    hibernate:
      ddl-auto: create-drop

cpf:
  service:
    url: http://localhost:65535

# Tópico do produtor (opcional; default já é "votos")
# app:
#   kafka:
#     topic:
#       votos: votos

logging:
  level:
    root: INFO
    org.springframework.kafka: DEBUG
    org.apache.kafka.clients.NetworkClient: DEBUG
    org.apache.kafka.clients.producer.KafkaProducer: DEBUG
    org.apache.kafka.clients.consumer.KafkaConsumer: DEBUG