app:
  kafka:
    enabled: false

spring:
  datasource:
    url: jdbc:h2:file:./data/votacao-db;MODE=LEGACY
    username: sa
    password:
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  http:
    encoding:
      charset: UTF-8
      force: true
      enable: true

cpf:
  service:
    url: https://brasilapi.com.br/api/cpf/v1